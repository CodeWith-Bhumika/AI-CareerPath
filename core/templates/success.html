<!DOCTYPE html>
<html>

<head>
    <title>Profile Created - AI CareerPath</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc, #e0f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1e293b;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.96);
            padding: 45px 35px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
        }

        .icon {
            width: 85px;
            height: 85px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #ecfdf5;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
        }

        h1 {
            color: #16a34a;
            font-size: 28px;
            margin-bottom: 15px;
        }

        .message {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .next {
            background: #eef2ff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            color: #4338ca;
            font-weight: bold;
        }

        a {
            display: inline-block;
            text-decoration: none;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 13px 25px;
            border-radius: 12px;
            font-weight: bold;
            transition: 0.2s;
        }

        a:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
        }

        .brand {
            margin-top: 28px;
            color: #4f46e5;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon">
            🎉
        </div>

        <h1>Profile Created Successfully!</h1>

        <p class="message">
            Your student information has been saved successfully.
            You're one step closer to discovering your ideal career path.
        </p>

        <div class="next">
            🚀 Next Step: Complete Your Skill Assessment
        </div>

        <a href="/assessment/">
            Continue to Skill Assessment →
        </a>

        <div class="brand">
            🚀 AI CareerPath
        </div>

    </div>

</body>

</html>
